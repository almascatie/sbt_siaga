<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Darurat Seram Bagian Timur</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase Wajib di Depan -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Konfigurasi Pusat -->
    <script src="config.js"></script>
    <!-- Inisialisasi Klien Global -->
    <script>
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    </script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center font-sans p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden p-8 space-y-6">
        
        <!-- Header & Logo/Judul -->
        <div class="text-center space-y-2">
            <span class="bg-red-100 text-red-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Command Center SBT</span>
            <h1 class="text-2xl font-black text-slate-900">Masuk Sistem Darurat</h1>
            <p class="text-xs text-slate-500">Silakan masukkan username dan password akun instansi Anda.</p>
        </div>

        <!-- Form Login -->
        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" id="login-user" required placeholder="Contoh: almas, admin, polri" class="w-full p-3 border border-slate-300 rounded-xl text-sm font-mono focus:ring-2 focus:ring-purple-600 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" id="login-pass" required placeholder="••••••••" class="w-full p-3 border border-slate-300 rounded-xl text-sm font-mono focus:ring-2 focus:ring-purple-600 outline-none transition">
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-purple-900 hover:bg-purple-800 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg shadow-purple-900/30">
                Masuk ke Dashboard 🚀
            </button>
        </form>

        <!-- Navigasi Bawah -->
        <div class="text-center pt-2 border-t border-slate-100">
            <a href="index.html" class="text-xs text-slate-500 hover:text-blue-600 transition font-medium">
                ← Kembali ke Beranda Pelaporan Publik
            </a>
        </div>

    </div>

    <!-- SCRIPT LOGIN -->
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();

            btn.disabled = true;
            btn.textContent = 'Memeriksa Kredensial...';

            try {
                // Cek data akun di tabel users
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', u)
                    .eq('password', p)
                    .single();

                if (error || !data) {
                    alert('Login Gagal! Username atau password salah.');
                    btn.disabled = false;
                    btn.textContent = 'Masuk ke Dashboard 🚀';
                    return;
                }

                // Simpan sesi login sementara di browser (sessionStorage)
                sessionStorage.setItem('sbt_logged_in', 'true');
                sessionStorage.setItem('sbt_user_id', data.id);
                sessionStorage.setItem('sbt_username', data.username);
                sessionStorage.setItem('sbt_nama_lembaga', data.nama_lembaga);
                sessionStorage.setItem('sbt_role', data.role);
                sessionStorage.setItem('sbt_telp_posko', data.telp_posko || '');

                alert(`Selamat datang, ${data.nama_lembaga} (${(data.role || '').toUpperCase()})!`);

                // Normalisasi role ke huruf kecil agar tahan terhadap perbedaan huruf besar/kecil di database
                const roleLower = (data.role || '').toLowerCase();

                // Arahkan halaman berdasarkan role pengguna secara aman
                if (roleLower === 'superadmin') {
                    sessionStorage.setItem('sbt_admin_auth', 'true'); // Penyelaras izin admin
                    window.location.href = 'admin.html';
                } else if (roleLower.includes('kolaborasi')) {
                    window.location.href = 'kolaborator.html'; // Menangkap 'petugas_kolaborasi' atau variasi lainnya
                } else {
                    window.location.href = 'petugas.html'; // Petugas utama / damkar / bpbd
                }

            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan sistem saat mencoba masuk.');
                btn.disabled = false;
                btn.textContent = 'Masuk ke Dashboard 🚀';
            }
        });
    </script>
</body>
</html>
