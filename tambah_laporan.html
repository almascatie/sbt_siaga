<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Laporan Mandiri Petugas - Sistem Darurat SBT</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    </script>
    <style>
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-blue-950 text-white px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <span class="bg-emerald-600 text-xs px-2.5 py-1 rounded font-bold uppercase tracking-wider">INPUT MANDIRI</span>
            <h1 class="font-bold text-sm md:text-base">Formulir Laporan Darurat Lapangan oleh Petugas</h1>
        </div>
        <div>
            <a href="petugas.html" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
                ← Kembali ke Command Center
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-start">

        <!-- KOTAK 1: PETA PILIH TITIK LOKASI -->
        <div class="bg-white rounded-xl shadow-md p-4 border border-slate-200 space-y-3">
            <h2 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                📍 Pilih Titik Lokasi Kejadian di Peta
            </h2>
            <p class="text-xs text-slate-500">Klik pada peta di bawah ini untuk menentukan titik koordinat lokasi laporan darurat secara akurat.</p>
            <div class="w-full h-80 rounded-lg overflow-hidden border border-slate-300 relative">
                <div id="map"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Longitude</label>
                    <input type="text" id="input-lng" readonly class="w-full p-2 bg-slate-50 border rounded font-mono text-slate-700" placeholder="Klik peta...">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Latitude</label>
                    <input type="text" id="input-lat" readonly class="w-full p-2 bg-slate-50 border rounded font-mono text-slate-700" placeholder="Klik peta...">
                </div>
            </div>
        </div>

        <!-- KOTAK 2: FORMULIR DETAIL LAPORAN -->
        <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 space-y-4">
            <h2 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                📋 Informasi Rinci Kejadian
            </h2>

            <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg text-xs space-y-1">
                <p class="font-bold text-blue-900">Petugas / Sumber Input:</p>
                <p id="info-petugas-login" class="text-blue-800 font-mono">-</p>
            </div>

            <form id="form-laporan-mandiri" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Nama Pelapor / Sumber Informasi</label>
                    <input type="text" id="input-nama" required placeholder="Contoh: Kepala Desa / Warga / Radio Posko" class="w-full p-2.5 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block font-medium text-slate-600 mb-1">Nomor Kontak Pelapor / Sumber (Opsional)</label>
                    <input type="tel" id="input-telp" placeholder="0812XXXXXXXX" class="w-full p-2.5 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>

                <div>
                    <label class="block font-medium text-slate-600 mb-1">Jenis Krisis / Darurat</label>
                    <select id="input-jenis" required class="w-full p-2.5 border border-slate-300 rounded outline-none bg-white font-medium">
                        <option value="Kebakaran">🔥 Karhutla / Titik Api / Kebakaran</option>
                        <option value="Kekeringan">💧 Krisis Air Bersih / Kekeringan</option>
                    </select>
                </div>

                <div>
                    <label class="block font-medium text-slate-600 mb-1">Nama Lokasi / Wilayah Singkat</label>
                    <input type="text" id="input-lokasi" required placeholder="Contoh: Desa Amar Timur / Hutan Bula" class="w-full p-2.5 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block font-medium text-slate-600 mb-1">Keterangan / Detail Laporan</label>
                    <textarea id="input-ket" rows="3" required placeholder="Jelaskan situasi, kondisi lapangan, atau kebutuhan mendesak..." class="w-full p-2.5 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
                    💾 Simpan & Terbitkan Laporan Mandiri
                </button>
            </form>
        </div>

    </main>

     <script src="assets/js/tambah_laporan.js"></script>
 
</body>
</html>
