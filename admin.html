<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Command Center SBT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase Wajib di Depan -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Konfigurasi Pusat -->
    <script src="config.js"></script>
    <!-- Inisialisasi Klien Global -->
    <script>
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-blue-950 text-white px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <span class="bg-red-600 text-xs px-2.5 py-1 rounded font-bold uppercase tracking-wider">SUPER ADMIN</span>
            <h1 class="font-bold text-sm md:text-base">Panel Kontrol Master Data & Lembaga</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="logoutAdmin()" class="bg-red-700 hover:bg-red-800 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
                🚪 Keluar
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- KARTU 1: KELOLA LEMBAGA & PERAN (3 PILAR) -->
        <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-sm md:text-base text-slate-800">🏛️ Manajemen Lembaga, Hotline & 3 Pilar Peran</h2>
                <button onclick="bukaModalLembaga()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow transition">
                    ➕ Tambah Lembaga Baru
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-50 text-slate-700 uppercase border-b">
                        <tr>
                            <th class="p-3">Nama Lembaga</th>
                            <th class="p-3">Hotline Telepon Posko</th>
                            <th class="p-3">Kategori Peran Sektoral</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-lembaga" class="divide-y divide-slate-200">
                        <!-- Diisi via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- KARTU 2: KELOLA AKUN PETUGAS -->
        <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-sm md:text-base text-slate-800">👤 Manajemen Akun Pengguna / Petugas</h2>
                <button onclick="bukaModalPetugas()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow transition">
                    ➕ Tambah Akun Baru
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-50 text-slate-700 uppercase border-b">
                        <tr>
                            <th class="p-3">Username</th>
                            <th class="p-3">Lembaga Terkait</th>
                            <th class="p-3">Role Akses</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-petugas" class="divide-y divide-slate-200">
                        <!-- Diisi via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- MODAL TAMBAH/EDIT LEMBAGA -->
    <div id="modal-lembaga" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-3">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl text-xs space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h3 id="modal-lembaga-title" class="font-bold text-sm text-slate-800">Tambah Lembaga Baru</h3>
                <button onclick="tutupModalLembaga()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
            </div>
            <form id="form-lembaga" class="space-y-3">
                <input type="hidden" id="lembaga-id">
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Nama Lembaga / Instansi</label>
                    <input type="text" id="input-nama-lembaga" required placeholder="Contoh: Dinas Kesehatan SBT" class="w-full p-2.5 border rounded outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Nomor Hotline / Telepon Posko</label>
                    <input type="text" id="input-hotline-lembaga" required placeholder="0812XXXXXXXX" class="w-full p-2.5 border rounded outline-none font-mono">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Kategori Peran Sektoral (Pilar Dashboard)</label>
                    <select id="input-kategori-peran" class="w-full p-2.5 border rounded bg-white outline-none font-semibold">
                        <option value="Utama">Lembaga Utama (Eksekutor / Verifikasi / Proses Utama) ➔ petugas.html</option>
                        <option value="Bantuan">Lembaga Bantuan / Kolaborator (Fokus Logistik & SDM) ➔ kolaborator.html</option>
                        <option value="Pimpinan">Pimpinan / Eksekutif (Bupati / Kadis / Monitoring) ➔ pimpinan.html</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded shadow transition">
                    💾 Simpan Data Lembaga
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL TAMBAH PETUGAS -->
    <div id="modal-petugas" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-center items-center p-3">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl text-xs space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h3 class="font-bold text-sm text-slate-800">Tambah Akun Pengguna Baru</h3>
                <button onclick="tutupModalPetugas()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
            </div>
            <form id="form-petugas" class="space-y-3">
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Username Login</label>
                    <input type="text" id="input-username-petugas" required placeholder="Contoh: kadis_kesehatan" class="w-full p-2.5 border rounded outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="input-password-petugas" required placeholder="******" class="w-full p-2.5 border rounded outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Pilih Lembaga Induk</label>
                    <select id="select-lembaga-induk" required class="w-full p-2.5 border rounded bg-white outline-none">
                        <!-- Diisi via JS -->
                    </select>
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Role / Hak Akses</label>
                    <select id="input-role-petugas" class="w-full p-2.5 border rounded bg-white outline-none">
                        <option value="petugas">Petugas / Kolaborator Operasional</option>
                        <option value="pimpinan">Pimpinan (Executive Monitoring)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded shadow transition">
                    💾 Simpan Akun Pengguna
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT UTAMA ADMIN -->
    <script>
        window.onload = () => {
            const isLogged = sessionStorage.getItem('sbt_logged_in');
            const role = sessionStorage.getItem('sbt_role');
            if (isLogged !== 'true' || role !== 'superadmin') {
                window.location.href = 'login.html';
                return;
            }
            muatDataLembaga();
            muatDataPetugas();
        };

        function logoutAdmin() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        async function muatDataLembaga() {
            const tbody = document.getElementById('table-lembaga');
            const selectInduk = document.getElementById('select-lembaga-induk');
            tbody.innerHTML = '';
            selectInduk.innerHTML = '<option value="">-- Pilih Lembaga --</option>';

            const { data, error } = await supabaseClient.from('lembaga').select('*').order('nama_lembaga');
            if (!error && data) {
                data.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.nama_lembaga;
                    opt.textContent = `${item.nama_lembaga} (${item.kategori_peran || 'Utama'})`;
                    selectInduk.appendChild(opt);

                    // Badge Kategori Peran
                    let badgePeran = '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold">Lembaga Utama (Eksekutor)</span>';
                    if (item.kategori_peran === 'Bantuan') {
                        badgePeran = '<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold">Lembaga Bantuan / Kolaborator</span>';
                    } else if (item.kategori_peran === 'Pimpinan') {
                        badgePeran = '<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">Pimpinan / Eksekutif</span>';
                    }

                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-slate-50';
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-slate-800">${item.nama_lembaga}</td>
                        <td class="p-3 font-mono">${item.hotline_telepon || '-'}</td>
                        <td class="p-3">${badgePeran}</td>
                        <td class="p-3 text-center space-x-2">
                            <button onclick="editLembaga('${item.id}', '${item.nama_lembaga}', '${item.hotline_telepon || ''}', '${item.kategori_peran || 'Utama'}')" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded font-semibold">✏️ Edit</button>
                            <button onclick="hapusLembaga('${item.id}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded font-semibold">🗑️ Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        async function muatDataPetugas() {
            const tbody = document.getElementById('table-petugas');
            tbody.innerHTML = '';

            const { data, error } = await supabaseClient.from('users').select('*').order('username');
            if (!error && data) {
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-slate-50';
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-slate-800">${item.username}</td>
                        <td class="p-3">${item.nama_lembaga || '-'}</td>
                        <td class="p-3 uppercase font-semibold text-blue-600">${item.role}</td>
                        <td class="p-3 text-center">
                            <button onclick="hapusPetugas('${item.id}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded font-semibold">🗑️ Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function bukaModalLembaga() {
            document.getElementById('lembaga-id').value = '';
            document.getElementById('input-nama-lembaga').value = '';
            document.getElementById('input-hotline-lembaga').value = '';
            document.getElementById('input-kategori-peran').value = 'Utama';
            document.getElementById('modal-lembaga-title').innerText = 'Tambah Lembaga Baru';
            document.getElementById('modal-lembaga').classList.remove('hidden');
        }

        function editLembaga(id, nama, hotline, peran) {
            document.getElementById('lembaga-id').value = id;
            document.getElementById('input-nama-lembaga').value = nama;
            document.getElementById('input-hotline-lembaga').value = hotline;
            document.getElementById('input-kategori-peran').value = peran;
            document.getElementById('modal-lembaga-title').innerText = 'Edit Data Lembaga';
            document.getElementById('modal-lembaga').classList.remove('hidden');
        }

        function tutupModalLembaga() { document.getElementById('modal-lembaga').classList.add('hidden'); }

        document.getElementById('form-lembaga').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('lembaga-id').value;
            const nama = document.getElementById('input-nama-lembaga').value.trim();
            const hotline = document.getElementById('input-hotline-lembaga').value.trim();
            const peran = document.getElementById('input-kategori-peran').value;

            if (id) {
                const { error } = await supabaseClient.from('lembaga').update({ nama_lembaga: nama, hotline_telepon: hotline, kategori_peran: peran }).eq('id', id);
                if (error) alert('Gagal update: ' + error.message);
                else { tutupModalLembaga(); muatDataLembaga(); }
            } else {
                const { error } = await supabaseClient.from('lembaga').insert([{ nama_lembaga: nama, hotline_telepon: hotline, kategori_peran: peran }]);
                if (error) alert('Gagal tambah: ' + error.message);
                else { tutupModalLembaga(); muatDataLembaga(); }
            }
        });

        async function hapusLembaga(id) {
            if (!confirm('Yakin ingin menghapus lembaga ini?')) return;
            const { error } = await supabaseClient.from('lembaga').delete().eq('id', id);
            if (error) alert('Gagal hapus: ' + error.message);
            else muatDataLembaga();
        }

        function bukaModalPetugas() {
            document.getElementById('form-petugas').reset();
            document.getElementById('modal-petugas').classList.remove('hidden');
        }

        function tutupModalPetugas() { document.getElementById('modal-petugas').classList.add('hidden'); }

        document.getElementById('form-petugas').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('input-username-petugas').value.trim();
            const password = document.getElementById('input-password-petugas').value.trim();
            const namaLembaga = document.getElementById('select-lembaga-induk').value;
            const role = document.getElementById('input-role-petugas').value;

            const { data: dataLembaga } = await supabaseClient.from('lembaga').select('hotline_telepon').eq('nama_lembaga', namaLembaga).single();
            const telpPosko = dataLembaga ? dataLembaga.hotline_telepon : '-';

            const { error } = await supabaseClient.from('users').insert([{
                username,
                password,
                nama_lembaga: namaLembaga,
                role,
                telp_posko: telpPosko
            }]);

            if (error) alert('Gagal tambah akun: ' + error.message);
            else {
                tutupModalPetugas();
                muatDataPetugas();
                alert('Akun berhasil dibuat!');
            }
        });

        async function hapusPetugas(id) {
            if (!confirm('Yakin ingin menghapus akun ini?')) return;
            const { error } = await supabaseClient.from('users').delete().eq('id', id);
            if (error) alert('Gagal hapus: ' + error.message);
            else muatDataPetugas();
        }
    </script>
</body>
</html>
